random_state: 42

split:
  test_size: 0.20
  stratify: true

cv:
  strategy: StratifiedKFold
  n_splits: 5
  n_repeats: 5
  shuffle: true

scoring:
  primary: f1
  secondary:
    - recall
    - precision
    - accuracy

experiments:
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6

models:
  - DecisionTree
  - RandomForest
